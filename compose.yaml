name: worknest

x-backend: &backend
  image: worknest-backend:local
  build: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    EMAIL_HOST: mailpit
    S3_ENDPOINT_URL: http://storage:9000

services:
  db:
    # PostgreSQL 17.11; immutable official image already verified locally.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    env_file: .env
    ports: ["127.0.0.1:${DATABASE_PORT:-55432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Redis 7.4.9; immutable official image already verified locally.
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      DATABASE_USER: ${DATABASE_OWNER}
      DATABASE_PASSWORD: ${DATABASE_OWNER_PASSWORD}
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  web:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready/', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2", "--hostname=worker@%h"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination worker@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: worknest-frontend:local
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://web:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      web: {condition: service_healthy}

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  storage:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    <<: *backend
    command: ["python", "initialize_storage.py"]
    depends_on:
      storage: {condition: service_healthy}
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  storage_data:
