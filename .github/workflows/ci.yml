name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180 db redis web worker frontend mailpit storage
      - run: docker compose run --rm storage-init
      - run: docker compose run --rm migrate python manage.py makemigrations --check --dry-run
      - name: Verify live services and restricted database role
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5173/
          curl --fail http://localhost:5173/api/v1/health/ready/
          docker compose exec -T web python verify_infrastructure.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
