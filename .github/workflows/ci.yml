name: WorkNest checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-test-password
      POSTGRES_DB: worknest
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: worknest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180 db redis web worker beat frontend mailpit storage
      - run: docker compose run --rm storage-init
      - run: docker compose run --rm migrate python manage.py makemigrations --check --dry-run
      - name: Verify live services and restricted database role
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5173/
          curl --fail http://localhost:5173/api/v1/health/ready/
          docker compose exec -T web python verify_infrastructure.py
          python backend/verify_accounts.py --base-url http://localhost:5173
          python backend/verify_organizations.py --base-url http://localhost:5173
          python backend/verify_team.py --base-url http://localhost:5173
          docker compose exec -T web python verify_tenant_security.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
